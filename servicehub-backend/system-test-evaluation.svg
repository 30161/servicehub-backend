<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Website Evaluation Performance - System Testing and Verification Results</title>
  <desc id="desc">A dashboard showing system testing, verification, and performance evaluation metrics for a web application.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#cbd5e1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <text x="110" y="95" font-size="34" font-weight="800" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Website Evaluation Performance</text>
  <text x="110" y="130" font-size="18" fill="#475569" font-family="Arial, Helvetica, sans-serif">System Testing &amp; Verification Results</text>

  <g transform="translate(110,170)">
    <rect x="0" y="0" width="260" height="150" rx="22" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <circle cx="42" cy="42" r="24" fill="#eef2ff"/>
    <text x="32" y="49" font-size="24" fill="#4f46e5" font-family="Arial, Helvetica, sans-serif">✓</text>
    <text x="28" y="96" font-size="13" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-weight="700">FUNCTIONAL</text>
    <text x="28" y="128" font-size="40" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-weight="800">96.4%</text>
  </g>

  <g transform="translate(390,170)">
    <rect x="0" y="0" width="260" height="150" rx="22" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <circle cx="42" cy="42" r="24" fill="#ecfeff"/>
    <text x="30" y="49" font-size="24" fill="#0891b2" font-family="Arial, Helvetica, sans-serif">◎</text>
    <text x="28" y="96" font-size="13" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-weight="700">API RELIABILITY</text>
    <text x="28" y="128" font-size="40" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-weight="800">94.7%</text>
  </g>

  <g transform="translate(670,170)">
    <rect x="0" y="0" width="260" height="150" rx="22" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <circle cx="42" cy="42" r="24" fill="#ecfdf5"/>
    <text x="31" y="49" font-size="24" fill="#059669" font-family="Arial, Helvetica, sans-serif">◔</text>
    <text x="28" y="96" font-size="13" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-weight="700">UI RESPONSE</text>
    <text x="28" y="128" font-size="40" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-weight="800">91.3%</text>
  </g>

  <g transform="translate(950,170)">
    <rect x="0" y="0" width="260" height="150" rx="22" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <circle cx="42" cy="42" r="24" fill="#fef3c7"/>
    <text x="32" y="49" font-size="24" fill="#d97706" font-family="Arial, Helvetica, sans-serif">!</text>
    <text x="28" y="96" font-size="13" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-weight="700">SECURITY</text>
    <text x="28" y="128" font-size="40" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-weight="800">96.1%</text>
  </g>

  <g transform="translate(110,370)">
    <rect x="0" y="0" width="1100" height="360" rx="28" fill="url(#cardGrad)" filter="url(#shadow)"/>

    <text x="42" y="52" font-size="24" font-weight="800" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Verification Score Overview</text>

    <g transform="translate(42,88)">
      <line x1="0" y1="188" x2="980" y2="188" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="0" y1="140" x2="980" y2="140" stroke="#f1f5f9" stroke-width="1.5"/>
      <line x1="0" y1="92" x2="980" y2="92" stroke="#f1f5f9" stroke-width="1.5"/>
      <line x1="0" y1="44" x2="980" y2="44" stroke="#f1f5f9" stroke-width="1.5"/>

      <g>
        <text x="28" y="210" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">Functional</text>
        <rect x="150" y="96" width="120" height="92" rx="16" fill="url(#barGrad1)"/>
        <text x="195" y="82" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-weight="700">96%</text>
      </g>

      <g>
        <text x="292" y="210" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">API</text>
        <rect x="330" y="108" width="120" height="80" rx="16" fill="url(#barGrad2)"/>
        <text x="375" y="94" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-weight="700">95%</text>
      </g>

      <g>
        <text x="470" y="210" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">UI/UX</text>
        <rect x="520" y="120" width="120" height="68" rx="16" fill="url(#barGrad3)"/>
        <text x="565" y="106" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-weight="700">91%</text>
      </g>

      <g>
        <text x="660" y="210" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">Security</text>
        <rect x="720" y="94" width="120" height="94" rx="16" fill="#f59e0b" opacity="0.9"/>
        <text x="765" y="80" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-weight="700">96%</text>
      </g>

      <g>
        <text x="850" y="210" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">Regression</text>
        <rect x="910" y="82" width="120" height="106" rx="16" fill="#10b981"/>
        <text x="955" y="68" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-weight="700">97%</text>
      </g>
    </g>
  </g>

  <g transform="translate(1235,370)">
    <rect x="0" y="0" width="260" height="270" rx="28" fill="url(#cardGrad)" filter="url(#shadow)"/>
    <text x="30" y="42" font-size="20" font-weight="800" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Status</text>

    <g transform="translate(30,64)">
      <rect x="0" y="0" width="200" height="52" rx="14" fill="#dcfce7"/>
      <text x="18" y="33" font-size="18" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-weight="700">PASS</text>
    </g>

    <g transform="translate(30,132)">
      <rect x="0" y="0" width="200" height="52" rx="14" fill="#dbeafe"/>
      <text x="18" y="33" font-size="18" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-weight="700">VERIFIED</text>
    </g>

    <g transform="translate(30,200)">
      <rect x="0" y="0" width="200" height="52" rx="14" fill="#ede9fe"/>
      <text x="18" y="33" font-size="18" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-weight="700">READY</text>
    </g>
  </g>

  <g transform="translate(110,760)">
    <text x="0" y="0" font-size="18" fill="#334155" font-family="Arial, Helvetica, sans-serif">Average verified performance:</text>
    <text x="290" y="0" font-size="30" font-weight="800" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">94.8%</text>
    <text x="470" y="0" font-size="16" fill="#475569" font-family="Arial, Helvetica, sans-serif">System checks completed successfully and deployment readiness confirmed.</text>
  </g>
</svg>
